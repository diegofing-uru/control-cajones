# Publica en GitHub Pages en cada push a main:
#   /<repo>/      demo sin backend, con datos de prueba
#   /<repo>/app/  app real instalable, conectada a Supabase (variables SUPABASE_URL y SUPABASE_ANON_KEY del repo)
# Activar una vez: Settings > Pages > Source: "GitHub Actions".
name: Publicar demo y app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # si falla una prueba, no se publica nada
      - run: npm run demo:build
        env:
          DEMO_BASE_URL: /${{ github.event.repository.name }}
      - run: npm run app:build
        env:
          DEMO_BASE_URL: /${{ github.event.repository.name }}/app
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Armar el sitio
        run: |
          mkdir sitio
          cp -R dist-demo/. sitio/
          cp -R dist-app sitio/app
          sed "s|__BASE__|/${{ github.event.repository.name }}|" scripts/404.html > sitio/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deploy
        uses: actions/deploy-pages@v4
